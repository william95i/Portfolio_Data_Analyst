version: 2

models:
  - name: stg_students
    description: Dernier parcours connu par identifiant, avant suppression des données individuelles dans les marts.
    columns:
      - name: user_id
        data_tests: [not_null, unique]

  - name: stg_insee_pop_2024
    description: Population INSEE 2024 ; les cinq territoires ultramarins sont agrégés en DROM.
    columns:
      - name: region
        data_tests: [not_null]
      - name: gender
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ALL', 'HOMME', 'FEMME']
      - name: age_group
        data_tests: [not_null]
      - name: population
        data_tests: [not_null]

  - name: int_students
    description: Dernier parcours par utilisateur, avec géographie et tranches d'âge harmonisées.
    columns:
      - name: user_id
        data_tests: [not_null, unique]
      - name: gender
        data_tests:
          - accepted_values:
              arguments:
                values: ['HOMME', 'FEMME', 'INCONNU']

  - name: fct_students_enriched
    description: Effectifs par année du dernier parcours, région, âge et genre ; ratio segmenté pour 10 000 habitants en 2024.
    columns:
      - name: students_count
        data_tests: [not_null]
      - name: approximate_age_count
        description: Nombre de « 60 ans ou plus » harmonisés en « 60-74 » dans ce segment.

